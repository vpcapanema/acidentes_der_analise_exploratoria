<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview · Sigma-Header Pública</title>
    <link rel="stylesheet" href="https://saopaulo.sp.gov.br/barra-govsp/css/top-padrao-govsp-v2.min.css?vs=3.0">
    <link rel="stylesheet" href="../../static/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="../../static/css/style_global_reset_base.css">
    <link rel="stylesheet" href="../../static/css/components/style_govsp_header_bridge.css">

</head>

<body>

    <div class="sigma-header sigma-top-stack sigma-top-stack--public">
<header class="sigma-header--public">
            <nav class="sigma-navbar">
                <div class="sigma-navbar__container">
                    <a href="#" class="sigma-navbar__brand">
                        <div class="sigma-navbar__brand-text">
                            <span class="sigma-navbar__brand-title">SIGMA-PLI</span>
                            <span class="sigma-navbar__brand-subtitle">Sistema Integrado de Gestão e
                                Monitoramento</span>
                        </div>
                    </a>

                    <button class="sigma-navbar__toggle" type="button" aria-label="Abrir menu">
                        <span class="sigma-navbar__toggle-icon"><i class="fas fa-bars"></i></span>
                    </button>

                    <div class="sigma-navbar__menu">
                        <ul class="sigma-navbar__nav">
                            <li class="sigma-navbar__item">
                                <a href="#" class="sigma-navbar__link">
                                    <i class="fas fa-home"></i><span>Home</span>
                                </a>
                            </li>
                            <li class="sigma-navbar__item">
                                <a href="#" class="sigma-navbar__link">
                                    <i class="fas fa-database"></i><span>Repositório de Arquivos</span>
                                </a>

                            <li class="sigma-navbar__item">
                                <a href="#" class="sigma-navbar__link">
                                    <i class="fas fa-chart-bar"></i><span>Dashboards e Análises</span>
                                </a>
                            </li>
                            <li class="sigma-navbar__item">
                                <a href="#" class="sigma-navbar__link">
                                    <i class="fas fa-envelope"></i><span>Contato</span>
                                </a>
                            </li>
                            <li class="sigma-navbar__item">
                                <a href="#" class="sigma-navbar__link">
                                    <i class="fas fa-question-circle"></i><span>Ajuda</span>
                                </a>
                            </li>
                        </ul>

                        <div class="sigma-navbar__actions">
                            <a href="#" class="sigma-navbar__btn sigma-navbar__btn--primary">
                                <i class="fas fa-lock"></i><span>Gestão do Sistema</span>
                            </a>
                        </div>
                    </div>
                </div>
            </nav>
        </header>

    </div>

    <script src="../../static/js/preview/script_navbar_preview_dropdown.js"></script>
